##
## Custom base config for fingertip retargeting (position-only).
## vec_weight order: [rot_x, rot_y, rot_z, pos_x, pos_y, pos_z]
## Sets rotation components to 0, position to 1 for position-only IK.
##

world_collision_checker_cfg:
  cache: null
  checker_type: "PRIMITIVE"
  max_distance: 0.1

cost:
  pose_cfg:
    vec_weight: [0.0, 0.0, 0.0, 1.0, 1.0, 1.0]
    weight: [0.0, 0.0]
    vec_convergence: [0.0, 0.00]
    terminal: False
  link_pose_cfg:
    vec_weight: [0.0, 0.0, 0.0, 1.0, 1.0, 1.0]
    weight: [0.0, 0.0]
    vec_convergence: [0.0, 0.00]
    terminal: False
  bound_cfg:
    weight: 000.0
    activation_distance: [0.0, 0.0, 0.0, 0.0]

constraint:
  primitive_collision_cfg:
    weight: 2000.0
    use_sweep: False
    classify: True
  self_collision_cfg:
    weight: 1000.0
    classify: True
  bound_cfg:
    weight: [5000.0, 5000.0, 5000.0, 5000.0]
    activation_distance: [0.0, 0.0, 0.0, 0.0]

convergence:
  pose_cfg:
    vec_weight: [0.0, 0.0, 0.0, 1.0, 1.0, 1.0]
    weight: [0.001, 10.0]
    vec_convergence: [0.0, 0.0]
    terminal: False
  link_pose_cfg:
    vec_weight: [0.0, 0.0, 0.0, 1.0, 1.0, 1.0]
    weight: [0.001, 10.0]
    vec_convergence: [0.0, 0.0]
    terminal: False
  cspace_cfg:
    weight: 1.0
    terminal: True
    run_weight: 0.0
    use_l2_kernel: True
  null_space_cfg:
    weight: 0.001
    terminal: True
    run_weight: 1.0
    use_l2_kernel: True
